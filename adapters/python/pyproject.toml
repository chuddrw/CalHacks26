[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orkio-adapter"
version = "0.1.0"
description = "Let LangGraph, LangChain and CrewAI agents join an Orkio team as first-class agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
langgraph = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-mcp-adapters>=0.2",
]
crewai = [
  "crewai>=1.0",
  "crewai-tools[mcp]>=1.0",
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orkio_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
